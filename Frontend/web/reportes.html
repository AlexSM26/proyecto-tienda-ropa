<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/reportes.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
    <nav class="admin-navbar navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="../admin.html">
                <i class="bi bi-arrow-left"></i> Volver al administrador
            </a>
        </div>
    </nav>
    <div class="container py-4">
        <h1 class="text-center mb-4">Reportes de Ventas</h1>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2>Marcas con al menos una venta</h2>
            </div>
            <div class="card-body">
                <table class="table" id="tabla-marcas">
                    <thead>
                        <tr><th>Marca</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2>Prendas vendidas y stock restante</h2>
            </div>
            <div class="card-body">
                <table class="table" id="tabla-prendas">
                    <thead>
                        <tr>
                            <th>Prenda</th>
                            <th>Vendidas</th>
                            <th>Stock Restante</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2>Top 5 marcas más vendidas</h2>
            </div>
            <div class="card-body">
                <table class="table" id="tabla-top5">
                    <thead>
                        <tr>
                            <th>Marca</th>
                            <th>Total Vendido</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../js/reportes.js"></script>
</body>
</html>
