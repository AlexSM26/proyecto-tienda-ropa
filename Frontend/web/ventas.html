<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ventas - Tienda de Ropa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/ventas.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
    <nav class="admin-navbar navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="../admin.html">
                <i class="bi bi-arrow-left"></i> Volver al administrador
            </a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="mb-4">Gestión de Ventas</h1>

        <!-- Formulario para agregar/editar ventas -->
        <div class="card mb-4">
            <div class="card-header">
                <h2 id="form-title">Agregar Nueva Venta</h2>
            </div>
            <div class="card-body">
                <form id="venta-form">
                    <input type="hidden" id="venta-id">
                    <div class="mb-3">
                        <label for="fecha_venta" class="form-label">Fecha de Venta</label>
                        <input type="date" class="form-control" id="fecha_venta" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-secondary" id="cancelar-edicion" style="display: none;">Cancelar</button>
                </form>
            </div>
        </div>

        <!-- Tabla de ventas -->
        <div class="card">
            <div class="card-header">
                <h2>Listado de Ventas</h2>
            </div>
            <div class="card-body">
                <table class="table table-striped" id="tabla-ventas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha de Venta</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Los datos se cargarán con AJAX -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../js/ventas.js"></script>
</body>
</html>
