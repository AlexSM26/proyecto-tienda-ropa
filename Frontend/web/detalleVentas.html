<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Detalle de Ventas - Tienda de Ropa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/detalleVentas.css">
    <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
    <nav class="admin-navbar navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="../admin.html">
                <i class="bi bi-arrow-left"></i> Volver al administrador
            </a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="mb-4">Gestión de Detalle de Ventas</h1>
        
        <!-- Formulario para agregar/editar detalle de ventas -->
        <div class="card mb-4">
            <div class="card-header">
                <h2 id="form-title">Agregar Nuevo Detalle de Venta</h2>
            </div>
            <div class="card-body">
                <form id="detalle-form">
                    <input type="hidden" id="detalle-id">
                    <div class="mb-3">
                        <label for="venta_id" class="form-label">Venta ID</label>
                        <input type="number" class="form-control" id="venta_id" required>
                    </div>
                    <div class="mb-3">
                        <label for="tipo_de_ropa_id" class="form-label">Tipo de Ropa ID</label>
                        <input type="number" class="form-control" id="tipo_de_ropa_id" required>
                    </div>
                    <div class="mb-3">
                        <label for="cantidad" class="form-label">Cantidad</label>
                        <input type="number" class="form-control" id="cantidad" required>
                    </div>
                    <div class="mb-3">
                        <label for="precio_unitario" class="form-label">Precio Unitario</label>
                        <input type="number" step="0.01" class="form-control" id="precio_unitario" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" class="btn btn-secondary" id="cancelar-edicion" style="display: none;">Cancelar</button>
                </form>
            </div>
        </div>
        
        <!-- Tabla de detalles de ventas -->
        <div class="card">
            <div class="card-header">
                <h2>Listado de Detalles de Venta</h2>
            </div>
            <div class="card-body">
                <table class="table table-striped" id="tabla-detalle-ventas">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Venta ID</th>
                            <th>Tipo de Ropa ID</th>
                            <th>Cantidad</th>
                            <th>Precio Unitario</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Datos se cargan por AJAX -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../js/detalleVentas.js"></script>
</body>
</html>
