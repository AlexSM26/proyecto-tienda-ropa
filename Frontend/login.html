<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - Tienda de Ropa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <nav class="admin-navbar navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-arrow-left"></i> Volver al inicio
            </a>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-header">
            <i class="bi bi-shield-lock"></i>
            <h2>Acceso Administrador</h2>
            <p class="text-muted">Ingrese sus credenciales para continuar</p>
        </div>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" placeholder="Usuario" required>
                <label for="username">Usuario</label>
            </div>

            <div class="form-floating mb-4">
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                    <span class="input-group-text" style="cursor: pointer;" id="togglePasswordBtn">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i> Ingresar
            </button>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
